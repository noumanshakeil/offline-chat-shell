<!DOCTYPE html><html><head><meta charset="utf-8"/><title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Offline-first messages — pending until sync.</p>
<p class="pill">pending {{ queue.pending }} · synced {{ queue.synced }}</p>
<form method="post" action="/ui/sync"><button type="submit">Sync queue</button></form>
<form method="post" action="/ui/message"><textarea name="content" rows="3" required></textarea><button type="submit">Send (local mock)</button></form>
{% for m in messages %}<pre><strong>{{ m.role }}</strong> <span class="pill">{{ m.sync_status }}</span> {{ m.content }}</pre>{% endfor %}
</main></body></html>
